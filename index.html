<!DOCTYPE html>
<html lang="en">

<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <!-- displays site properly based on user's device -->

      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap">
      <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

      <title>Frontend Mentor | NFT preview card component</title>

      <link rel="stylesheet" href="./style.css">
</head>

<body>
      <div class="container">
            <div class="card">
                  <div class="card__image__holder">
                        <img class="card__image" src="./images/image-equilibrium.jpg" alt="Equilibrium artwork">
                        <div class="card__image__view">
                              <img src="./images/icon-view.svg" aria-hidden="true" alt="">
                        </div>
                  </div>
                  <h2 class="card__header">
                        <a>
                              Equilibrium #3429
                        </a>
                  </h2>
                  <p class="card__body">
                        Our Equilibrium collection promotes balance and calm.
                  </p>
                  <div class="card__status">
                        <div class="card__status__currency">
                              <img src="./images/icon-ethereum.svg" aria-hidden="true" alt="">
                              <div class="center-text-hzl">0.041 ETH</div>
                        </div>
                        <div class="card__status__time">
                              <img src="./images/icon-clock.svg" aria-hidden="true" alt="">
                              <div class="center-text-hzl">3 days left</div>
                        </div>
                  </div>
                  <div class="card__creator">
                        <img src="./images/image-avatar.png" alt="User avatar">
                        <div class="center-text-hzl">
                              <span>Creation of <a> Jules Wyvern</a></span>
                        </div>
                  </div>
            </div>
</body>

</html>
